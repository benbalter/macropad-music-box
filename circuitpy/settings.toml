# Parent settings, read by code.py at startup. Whole numbers only.

# Speaker volume, 0-100. The speaker is tiny, so even 100 isn't loud.
VOLUME = 100

# Key light brightness, 0-100.
BRIGHTNESS = 30

# Minutes without a button press before the lights, screen, and sound turn off.
# Any key or the dial wakes it back up.
SLEEP_MINUTES = 10
