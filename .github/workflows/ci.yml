name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      # Lint also bans modules CircuitPython doesn't have (see pyproject.toml),
      # since the tests run on CPython and wouldn't catch those.
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pytest
